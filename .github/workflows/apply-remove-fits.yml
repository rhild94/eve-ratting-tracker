name: Apply complete Fits removal

on:
  push:
    branches: [remove-fits]
    paths:
      - .github/workflows/apply-remove-fits.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-fits
      - name: Remove Fits feature and references
        run: |
          python -c "from pathlib import Path; p=Path('scripts/remove_fits_once.py'); s=p.read_text(); s=s.replace('if not path.is_file() or \".git\" in path.parts or path.name in {\"apply-remove-fits.yml\", \"remove_fits_once.py\"}:','if str(path) == \"static/react/app.js\" or not path.is_file() or \".git\" in path.parts or path.name in {\"apply-remove-fits.yml\", \"remove_fits_once.py\"}:'); p.write_text(s)"
          python scripts/remove_fits_once.py
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Fits feature completely"
          git push origin remove-fits
