name: Apply Beta v2 Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_beta_v2.yml'
      - 'scripts/apply_beta_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/apply_beta_v2.py
      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build:frontend
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run regression suite
        run: python -m pytest tests -v --tb=short
      - name: Commit integrated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/react/main.tsx static/react/app.js templates/react.html tests/test_tracker_api.py
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "Integrate PostgreSQL fits and Beta UI polish"
            git push origin main
          fi
