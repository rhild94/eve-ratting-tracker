name: Apply release v4 backend patch

on:
  push:
    branches: [release/v9.2-layout-history]
    paths:
      - scripts/apply_release_v4.py
      - .github/workflows/apply-release-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: release/v9.2-layout-history
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply backend patch
        run: |
          python scripts/apply_release_v4.py
          python -m py_compile app.py
          printf '9.2.0\n' > VERSION
      - name: Commit patched backend
        run: |
          if git diff --quiet; then
            echo "No backend patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py VERSION
          git commit -m "Add v9.2 backend pagination and character controls"
          git push origin HEAD:release/v9.2-layout-history
