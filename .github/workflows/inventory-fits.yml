name: Inventory Fits references

on:
  push:
    branches: [remove-fits]
    paths:
      - .github/workflows/inventory-fits.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory fit-related references
        run: |
          echo '=== FIT-RELATED FILE NAMES ==='
          find . -path ./.git -prune -o -iname '*fit*' -print | sort
          echo '=== FIT-RELATED TEXT REFERENCES ==='
          grep -RniE 'fit_selection|/api/fits|view=fits|Fits|fitWorkbench|beta-fit|eveRattingFits|fitting-wheel|saved-fit|fit-selection|fit-select|fit_payload|fitPage|fitViewer|renderFits|saveFit|loadFits|deleteFit|migrateLegacyFits' . --exclude-dir=.git || true
