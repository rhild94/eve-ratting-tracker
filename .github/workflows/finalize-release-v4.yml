name: Finalize release v9.2 frontend

on:
  push:
    branches: [release/v9.2-layout-history]
    paths:
      - scripts/finalize_release_v4.py
      - .github/workflows/finalize-release-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: release/v9.2-layout-history
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final release patches
        run: |
          python scripts/finalize_release_v4.py
          python -m py_compile app.py
          printf '9.2.0\n' > VERSION
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React frontend
        run: |
          npm install --no-audit --no-fund
          npm run build:frontend
      - name: Commit finalized release
        run: |
          if git diff --quiet; then
            echo "No finalization changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py VERSION static/tracker.js static/react/main.tsx static/react/app.js static/prod_update_v3.js
          git commit -m "Finalize v9.2 tracker, history and progression UI"
          git push origin HEAD:release/v9.2-layout-history
