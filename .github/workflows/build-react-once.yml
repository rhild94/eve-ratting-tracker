name: One-time React bundle rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-react-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:frontend
      - name: Commit generated bundle
        run: |
          if ! git diff --quiet -- static/react/app.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/react/app.js
            git commit -m "Build React frontend bundle"
            git push origin main
          fi
