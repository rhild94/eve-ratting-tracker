name: Ratting Tracker Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run regression suite
        run: python -m pytest tests -v --tb=short

      - name: Build downloadable tracker package
        if: success()
        run: |
          mkdir -p release/eve-ratting-tracker
          cp app.py requirements.txt README.md release/eve-ratting-tracker/
          cp -r static templates release/eve-ratting-tracker/
          cd release
          zip -r eve-ratting-tracker.zip eve-ratting-tracker

      - name: Upload tracker package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eve-ratting-tracker
          path: release/eve-ratting-tracker.zip
          retention-days: 30

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
