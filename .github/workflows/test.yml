name: Ratting Tracker Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNT_TEST_POSTGRES_URL: postgresql://tracker_test:test_only_password@localhost:5432/tracker_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build React frontend
        run: |
          npm install --no-audit --no-fund
          npm run build:frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run regression suite
        run: python -m pytest tests -v --tb=short

      - name: Build downloadable tracker package
        if: success()
        run: |
          mkdir -p release/eve-ratting-tracker
          cp app.py accounts.py launcher.py RUN_TRACKER.bat requirements.txt README.md VERSION .env.example release/eve-ratting-tracker/
          cp -r static templates release/eve-ratting-tracker/
          cd release
          zip -r eve-ratting-tracker.zip eve-ratting-tracker

      - name: Upload tracker package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eve-ratting-tracker
          path: release/eve-ratting-tracker.zip
          retention-days: 30

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
