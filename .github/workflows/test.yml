name: Ratting Tracker Tests

on:
  push:
    branches: [main, web-hosted-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build React frontend
        run: |
          npm install --no-audit --no-fund
          npm run build:frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run regression suite
        run: python -m pytest tests -v --tb=short

      - name: Commit generated frontend bundle
        if: success() && github.event_name == 'push'
        run: |
          if ! git diff --quiet -- static/react/app.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/react/app.js
            git commit -m "Build React frontend bundle"
            git push
          fi

      - name: Build downloadable tracker package
        if: success()
        run: |
          mkdir -p release/eve-ratting-tracker
          cp app.py launcher.py RUN_TRACKER.bat requirements.txt README.md VERSION .env.example release/eve-ratting-tracker/
          cp -r static templates release/eve-ratting-tracker/
          cd release
          zip -r eve-ratting-tracker.zip eve-ratting-tracker

      - name: Upload tracker package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eve-ratting-tracker
          path: release/eve-ratting-tracker.zip
          retention-days: 30

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
