services:
  - type: web
    name: eve-ratting-tracker
    runtime: python
    plan: 0.5c-512mb
    buildCommand: npm install --no-audit --no-fund && npm run build:frontend && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: TRACKER_DB_PATH
        value: /var/data/ratting_tracker.db
      - key: ESI_AUTO_SYNC_SECONDS
        value: "1800"
      - key: ESI_AUTO_SYNC_INITIAL_DELAY_SECONDS
        value: "10"
      - key: EVE_CLIENT_ID
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
    disk:
      name: tracker-data
      mountPath: /var/data
      sizeGB: 1
